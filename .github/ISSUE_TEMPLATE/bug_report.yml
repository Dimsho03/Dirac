name: Bug report
description: Report a reproducible problem in Dirac for Android
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not publish real VPN profiles, UUIDs, passwords, private keys, access tokens, subscription URLs, or unredacted exported configurations.
  - type: input
    id: version
    attributes:
      label: Dirac version / commit
      placeholder: e.g. commit SHA or branch name
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version and device
      placeholder: e.g. Android 14, Pixel 7
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact endpoint addresses, UUIDs, keys, tokens and credentials before posting.
    validations:
      required: false